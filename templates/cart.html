<!DOCTYPE html>
<html>
<head>
    <title>Recharge Cart</title>
</head>
<body>

    <h1>Recharge Cart</h1>

    {% if cart %}

    <table border="1">
        <tr>
            <th>Family Member</th>
            <th>Mobile Number</th>
            <th>Plan</th>
            <th>Price</th>
        </tr>

        {% for item in cart %}
        <tr>
            <td>{{ item["name"] }}</td>
            <td>{{ item["mobile"] }}</td>
            <td>{{ item["plan"] }}</td>
            <td>₹{{ item["price"] }}</td>
        </tr>
        {% endfor %}

    </table>

    <h2>Total: ₹{{ total }}</h2>

    <br>

    <a href="/payment">
        <button>Proceed to Payment</button>
    </a>

    {% else %}

    <p>Your cart is empty.</p>

    {% endif %}

    <br><br>

    <a href="/plans">
        <button>Back to Plans</button>
    </a>

    <a href="/clear-cart">
        <button>Clear Cart</button>
    </a>

    <a href="/">
        <button>Back to Home</button>
    </a>

</body>
</html>
